<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B12">
<title>The Paint Patch HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B12;--bg2:#12121C;--card:#161622;--line:#262636;--tx:#F3F3F8;--mu:#9696AE;--pink:#FF2E93;--violet:#8B5CFF;--violet2:#B18CFF;--lime:#C6FF3D;--orange:#FF9F1C;--cyan:#22D3EE;--slate:#8DA2C0;--ok:#C6FF3D;--warn:#FFB020;--bad:#FF4D5E;--r:16px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;margin:4px 0}
textarea{resize:vertical;line-height:1.5}h1,h2,h3{font-family:'Space Grotesk',Inter,sans-serif;margin:0}
#app{max-width:760px;margin:0 auto;padding:0 12px calc(86px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 2px 10px;background:linear-gradient(var(--bg) 75%,transparent)}
.brand{display:flex;gap:10px;align-items:center}.brand b{font-family:'Space Grotesk';font-size:18px;display:block;line-height:1.1}.brand small{color:var(--mu);font-size:12px}
.badge{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#000 34%,transparent 35%),conic-gradient(var(--pink),var(--orange),var(--lime),var(--cyan),var(--violet),var(--pink));box-shadow:0 0 18px #ff2e9355;flex:none}.badge.big{width:72px;height:72px;display:block;margin:0 auto 12px}
.who{display:flex;flex-direction:column;align-items:flex-end;gap:2px}.who select{width:auto;max-width:170px;padding:6px 8px;font-size:12px;margin:0;border-radius:999px}#savest{font-size:11px;color:var(--mu)}#savest .warn{color:var(--warn)}#savest .bad{color:var(--bad)}
.seg{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px;margin:4px 0 10px;overflow-x:auto}.seg button{flex:1;padding:8px 10px;border-radius:999px;font-weight:600;font-size:13px;color:var(--mu);text-align:center;white-space:nowrap}.seg button.on{background:var(--tx);color:var(--bg)}.seg.sm button{padding:6px 8px;font-size:12px}
.sites{position:sticky;top:64px;z-index:15}
.locked{font-size:13px;color:var(--mu);margin:2px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}.card>header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}.card h2{font-size:17px;display:flex;align-items:center;gap:8px}.ic{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;background:#ffffff10;font-size:13px}
.card h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:16px 0 6px}
.scr-title h1{font-size:24px;margin:6px 2px 12px}
.briefing{background:linear-gradient(135deg,#1c1230,#161622 55%);border-color:#3a2a5c}
.brief{margin:0;padding:0;list-style:none;counter-reset:b}.brief li{border-left:3px solid var(--line);padding:6px 0 6px 10px;margin:4px 0}.brief li.sev3{border-color:var(--pink)}.brief li.sev2{border-color:var(--warn)}.brief li.sev1{border-color:var(--lime)}.brief button{font-size:14.5px}
.more{color:var(--violet2);font-weight:600;font-size:13px;margin-top:6px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;background:#ffffff14;color:var(--tx);white-space:nowrap}.pill.ok{background:#c6ff3d22;color:var(--lime)}.pill.warn{background:#ffb02022;color:var(--warn)}.pill.bad{background:#ff4d5e22;color:var(--bad)}.pill.hot{background:var(--pink);color:#fff}.pill.muted{color:var(--mu)}
.vpill{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.02em;margin-right:4px;vertical-align:1px}.v-mk{background:#C6FF3D;color:#111}.v-hat{background:#FF2E93;color:#fff}.vpill:not(.v-mk):not(.v-hat){background:#8DA2C0;color:#111}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--mu);flex:none}.dot.ok{background:var(--lime)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.muted{color:var(--mu)}.small{font-size:12.5px}.r{margin-left:auto}.sub{color:var(--mu);font-size:12.5px;margin-top:10px}.empty{color:var(--mu);padding:14px;text-align:center}
.link{color:var(--violet2);font-weight:600;text-decoration:underline;text-decoration-color:#b18cff55;text-underline-offset:3px}
.ap{border:1px solid var(--line);border-left:4px solid var(--dc);border-radius:12px;padding:12px;margin:8px 0;background:var(--bg2)}
.ap-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}.kind{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dc);font-weight:700}
.due{font-size:12px;color:var(--mu);margin-left:auto}.due.soon{color:var(--warn)}.due.over{color:var(--bad);font-weight:700}
.ap-title{font-weight:700;font-size:15.5px;display:block}.ap-issue{color:var(--mu);font-size:13.5px;margin:2px 0 6px}
.rec{font-size:13.5px;margin:6px 0}.routed{font-size:12.5px;color:var(--mu)}
.flag{font-size:13px;padding:7px 10px;border-radius:9px;background:#ffb02014;color:#ffd38a;margin:6px 0}.flag.bad{background:#ff4d5e14;color:#ff9aa4}.flag.warn{background:#ffb02014}.flag .link{color:inherit}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.ap .btns{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr}.ap .btns .b{padding:9px 4px;font-size:13px}
.b{display:inline-flex;align-items:center;justify-content:center;padding:9px 12px;border-radius:10px;background:#ffffff12;font-weight:600;font-size:14px;min-height:40px;text-align:center}.b.ok{background:var(--lime);color:#111}.b.bad{background:var(--bad);color:#fff}.b.ghost{background:none;border:1px solid var(--line);color:var(--mu)}.b.sm{padding:5px 10px;min-height:30px;font-size:12.5px}.b.block{display:flex;width:100%;margin:6px 0}.b:disabled{opacity:.4}
.chip{font-size:12px;color:var(--mu);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
.venue-block{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.venue-block:first-child{border:0;margin:0;padding:0}.vb-head{display:flex;align-items:center;gap:4px;margin-bottom:8px}
.chips6{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}.c6{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:7px 8px}.c6 b{font-family:'Space Grotesk';font-size:20px;display:block;line-height:1.1}.c6 span{font-size:11px;color:var(--mu)}.c6.bad b{color:var(--bad)}.c6.warnc b{color:var(--warn)}.c6.okc b{color:var(--lime)}
.sess{list-style:none;margin:0 0 6px;padding:0}.sess li button{display:grid;grid-template-columns:88px 1fr auto 30px;gap:8px;width:100%;padding:7px 4px;border-bottom:1px solid #ffffff0a;font-size:13.5px;align-items:center}.sess .t{color:var(--mu);font-variant-numeric:tabular-nums}.sess .r{font-size:12px;color:var(--mu)}.sess .g{text-align:right;font-weight:700}.sess li.clash button{background:#ff4d5e12;border-radius:8px}
.trade{margin-bottom:10px}.tr-h{display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:6px}.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.tile{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 10px}.tile span{display:block;font-size:11.5px;color:var(--mu)}.tile b{font-family:'Space Grotesk';font-size:21px}
.d{font-size:12px;font-weight:700;margin-left:6px}.d.up{color:var(--lime)}.d.down{color:var(--bad)}.d.flat{color:var(--mu)}.src{font-size:11.5px;color:var(--mu)}
.h-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.h-grid div{background:var(--bg2);border-radius:12px;padding:10px}.big{font-family:'Space Grotesk';font-size:26px;display:block}.h-grid span{font-size:12px;color:var(--mu)}
.list{list-style:none;padding:0;margin:0}.list li{padding:6px 0;border-bottom:1px solid #ffffff08;font-size:13.5px;display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.owners{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}.owners button{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px}.owners b{display:block;font-size:13.5px}.owners span{font-size:12px;color:var(--mu)}.owners em{color:var(--bad);font-style:normal}
.threads{list-style:none;padding:0;margin:0}.threads li>button{width:100%;padding:11px 2px;border-bottom:1px solid var(--line)}.tl1{display:flex;align-items:center;gap:6px}.tl2{font-weight:600;margin-top:2px}.tl3{font-size:12.5px;color:var(--violet2)}.tl4{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow{display:block;width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0}.pr1{display:flex;align-items:center;gap:6px}.pr1 .pill{margin-left:auto}.pr2{font-size:13px;color:var(--mu);margin-top:2px}.pr3{font-size:12.5px;color:var(--warn);margin-top:3px}
.scrim{position:fixed;inset:0;background:#000a;z-index:40;animation:fade .15s}.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;z-index:41;background:var(--bg);border-top:1px solid var(--line);border-radius:22px 22px 0 0;max-width:760px;margin:0 auto;display:flex;flex-direction:column;animation:up .2s ease-out}
.sheet-body{overflow-y:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom))}.grab{width:44px;height:5px;border-radius:9px;background:#ffffff30;margin:8px auto 4px}.x{position:absolute;right:12px;top:10px;width:34px;height:34px;border-radius:50%;background:#ffffff12;text-align:center}
.sheet h1{font-size:21px;margin:8px 40px 4px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.meta{color:var(--mu);font-size:13px;margin-bottom:10px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}@keyframes fade{from{opacity:0}}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}.kv div{background:var(--card);border-radius:10px;padding:7px 9px}.kv span{display:block;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}.kv b{font-size:14px;font-weight:600}.kv.one{grid-template-columns:1fr}
.msgs{display:flex;flex-direction:column;gap:8px}.msg{border-radius:12px;padding:9px 11px;max-width:92%;white-space:pre-wrap;font-size:14px}.msg.in{background:var(--card);align-self:flex-start}.msg.out{background:#2a1740;align-self:flex-end}.mh{font-size:11px;color:var(--mu);margin-bottom:3px}
.srcs{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0;font-size:12px;align-items:center}.srcs b{width:100%;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}.src-chip{font-size:11.5px;background:#8b5cff22;color:var(--violet2);border-radius:8px;padding:4px 8px}
.choice{background:#ffb02012;border:1px solid #ffb02040;border-radius:12px;padding:12px;margin:8px 0}
.reason{background:#ffb02014;color:#ffd38a;border-radius:10px;padding:8px 10px;margin:8px 0;font-size:13.5px}
.hs{background:#fff;color:#111;border-radius:14px;padding:14px;margin:10px 0;font-size:13.5px}.hs-h{display:flex;justify-content:space-between;gap:8px;border-bottom:3px solid #111;padding-bottom:8px}.hs-k{font-size:10px;letter-spacing:.2em;font-weight:700}.hs-t{font-family:'Space Grotesk';font-size:20px;font-weight:700}.hs-s{font-weight:800;font-size:12px;border:2px solid;padding:5px 8px;border-radius:8px;height:fit-content;white-space:nowrap}.hs-s.ok{color:#2a7a00}.hs-s.warn{color:#b35c00}
.hs-g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}.hs-g div{border:1px solid #ddd;border-radius:8px;padding:5px 7px}.hs-g span{display:block;font-size:10px;text-transform:uppercase;color:#666}.hs-g b{font-size:15px}.hs-g small{display:block;font-size:11px;color:#444}
.hs h4{margin:12px 0 4px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}.hs table{width:100%;border-collapse:collapse}.hs td{border-bottom:1px solid #eee;padding:4px 2px}.hs-food span,.hs-kids span{display:inline-block;margin:2px 6px 2px 0;padding:2px 7px;background:#f2f2f2;border-radius:6px}.hs-kids span{background:none;padding:0 8px 0 0;font-size:12.5px;color:#333}.hs .miss{color:#c00;font-weight:700;background:#ffe5e5}.hs ul{margin:0;padding-left:18px}.hs-f{margin-top:10px;font-size:11px;color:#777}
pre.inv{white-space:pre-wrap;background:var(--card);border-radius:10px;padding:10px;font:13px/1.5 Inter,sans-serif;margin:6px 0}
.row{display:flex;gap:6px;align-items:center}.row input{flex:1}
.log{list-style:none;padding:0;margin:0}.log li{display:grid;grid-template-columns:70px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid #ffffff08;font-size:13px}.lt{color:var(--mu);font-size:12px;font-variant-numeric:tabular-nums}.ld{color:var(--mu);font-size:12.5px}.lv-ok b{color:var(--lime)}.lv-warn b{color:var(--warn)}.lv-fail b{color:var(--bad)}
.search{margin-bottom:6px}
.map{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:620px){.map{grid-template-columns:1fr 1fr}}
.dept{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--dc);border-radius:var(--r);padding:12px}.dept h2{font-size:15px;color:var(--dc);margin-bottom:8px}.flow{display:flex;flex-direction:column;align-items:stretch}.arrow{text-align:center;color:var(--dc);opacity:.7;line-height:1.2}
.node{display:flex;flex-wrap:wrap;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 10px}.node b{font-size:14px}.nm{width:100%;font-size:11.5px;color:var(--mu);padding-left:15px}.need{margin-left:auto;background:var(--pink);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px}.soon{font-size:12.5px;color:var(--mu)}
.lastrun{background:var(--card);border-radius:10px;padding:9px 10px;font-size:13.5px;margin:6px 0}
.kn{list-style:none;padding:0;margin:0}.kn li>button{width:100%;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;padding:9px 0;border-bottom:1px solid #ffffff08}.kn b{font-size:14px}.kv-v{margin-left:auto;font-weight:600;color:var(--lime)}.kn .small{width:100%}
.integ{display:flex;justify-content:space-between;align-items:center;width:100%;padding:11px 0;border-bottom:1px solid var(--line)}.integ b{display:block}.integ .muted{font-size:12.5px}
table.pv{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0}.pv th,.pv td{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left;vertical-align:top}.st-new b{color:var(--lime)}.st-duplicate b{color:var(--mu)}.st-possible b{color:var(--warn)}.st-error b{color:var(--bad)}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}.steps li{counter-increment:s;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0 10px 38px;border-bottom:1px solid var(--line);position:relative}.steps li::before{content:counter(s);position:absolute;left:0;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#ffffff12;font-weight:700;font-size:13px}.steps li.done::before{background:var(--lime);color:#111;content:'✓'}.steps li.next::before{background:var(--pink)}.steps li.done{color:var(--mu)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tres{list-style:none;padding:0;margin:6px 0}.tres li{padding:5px 0;border-bottom:1px solid #ffffff08;font-size:13px}.tres .PASS b{color:var(--lime)}.tres .FAIL b{color:var(--bad)}
.vrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid #ffffff08}.vrow .small{width:100%}
.morelist{display:flex;flex-direction:column;gap:6px;margin-top:8px}.morelist button{display:flex;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:#0b0b12f2;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mu);position:relative;padding:4px 0;text-align:center}.tabs .ti{font-size:19px;line-height:1.2}.tabs button.on{color:var(--tx)}.tabs button.on .ti{color:var(--pink)}.badge-n{position:absolute;top:0;left:calc(50% + 6px);background:var(--pink);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:0 5px;min-width:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13.5px;z-index:60;max-width:90vw;box-shadow:0 8px 30px #0008}
.clrow{display:block;width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin:6px 0;position:relative}.cl1{display:flex;justify-content:space-between;gap:8px;font-size:14px}.cl1 span{font-size:12px;white-space:nowrap}.cl1 .over{color:var(--bad);font-weight:700}.clrow.overdue{border-color:#ff4d5e66}.clrow.complete{opacity:.6}.bar{height:5px;background:#ffffff12;border-radius:9px;margin:7px 40px 0 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--lime)}.cl2{position:absolute;right:11px;bottom:6px;font-size:12px}

table.rota{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:6px}.rota th{font-size:11px;color:var(--mu);text-align:left;font-weight:600}.rota td,.rota th{padding:5px 4px;border-bottom:1px solid #ffffff08}.rota tr.gap td{background:#ff4d5e14}.rota tr.gap td:nth-child(4) b{color:var(--bad)}
.stock{list-style:none;padding:0;margin:0}.stock li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #ffffff08}.stock li.low b:first-child{color:var(--warn)}.stepper{display:flex;align-items:center;gap:8px}.stepper b{min-width:28px;text-align:center;font-size:17px}
.outs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}.outs button{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-weight:600;font-size:13.5px}.outs button.on{background:#c6ff3d22;border-color:var(--lime);color:var(--lime)}
.live{font-size:9.5px;font-weight:800;letter-spacing:.06em;background:var(--lime);color:#111;border-radius:5px;padding:1px 5px}.demo{font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--mu);border:1px solid var(--line);border-radius:5px;padding:0 4px}
.nc{background:var(--bg2);border:1px dashed #ffffff26;border-radius:12px;padding:10px 12px;margin:6px 0;font-size:13.5px}.nc b{display:block;font-weight:600}.nc span{color:var(--mu);font-size:12.5px}
details.add{margin:6px 0}details.add summary{cursor:pointer;color:var(--violet2);font-weight:600;font-size:13.5px;padding:6px 0}

<body>
<div id="app"></div>

<script>/* The Paint Patch HQ — workflow engine.
   Pure functions over one state object S. Ordinary rules do calculations, deadlines,
   reminders and status changes. "AI" steps (classification, drafting, summaries) are
   marked kind:'ai' and use deterministic demo stand-ins until a model is connected. */
(function (root) {
  const E = {};
  let clock = () => new Date();
  E.setClock = fn => { clock = fn; };
  E.now = () => clock();

  // ---------- time (Europe/London) ----------
  const TZ = 'Europe/London';
  const partsFmt = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  function lParts(d) { const o = {}; partsFmt.formatToParts(d).forEach(p => o[p.type] = p.value); return o; }
  E.lDate = d => { const p = lParts(d || E.now()); return `${p.year}-${p.month}-${p.day}`; };
  E.lTime = d => { const p = lParts(d || E.now()); return `${p.hour}:${p.minute}`; };
  E.toInstant = (date, time) => { // London wall time -> Date
    const [y, m, dd] = date.split('-').map(Number); const [hh, mm] = (time || '00:00').split(':').map(Number);
    let guess = Date.UTC(y, m - 1, dd, hh, mm);
    for (let i = 0; i < 2; i++) { const p = lParts(new Date(guess)); const asUTC = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute); guess += Date.UTC(y, m - 1, dd, hh, mm) - asUTC; }
    return new Date(guess);
  };
  E.addDays = (date, n) => { const d = new Date(date + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  E.dayDiff = (a, b) => Math.round((new Date(b + 'T12:00:00Z') - new Date(a + 'T12:00:00Z')) / 864e5);
  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], DOWL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  E.dow = date => new Date(date + 'T12:00:00Z').getUTCDay();
  E.fmtDate = date => { if (!date) return '—'; const d = new Date(date + 'T12:00:00Z'); return `${DOW[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]}`; };
  E.fmtDateLong = date => { const d = new Date(date + 'T12:00:00Z'); return `${DOWL[d.getUTCDay()]} ${d.getUTCDate()} ${['January','February','March','April','May','June','July','August','September','October','November','December'][d.getUTCMonth()]}`; };
  E.relDay = date => { const t = E.lDate(); const n = E.dayDiff(t, date); if (n === 0) return 'Today'; if (n === 1) return 'Tomorrow'; if (n === -1) return 'Yesterday'; if (n > 1 && n < 7) return DOWL[E.dow(date)]; return E.fmtDate(date); };
  E.fmtStamp = iso => { if (!iso) return '—'; const d = new Date(iso); const ld = E.lDate(d); return (ld === E.lDate() ? '' : E.fmtDate(ld) + ' ') + E.lTime(d); };
  E.addMins = (t, m) => { const [h, mm] = t.split(':').map(Number); const x = h * 60 + mm + m; return `${String(Math.floor(x / 60) % 24).padStart(2, '0')}:${String(x % 60).padStart(2, '0')}`; };
  E.mins = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  E.andList = a => a.length < 2 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
  E.gbp = n => (n == null || isNaN(n)) ? 'Unknown' : '£' + Number(n).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  // ---------- ids, log, idempotency ----------
  E.id = (S, p) => { S.seq = (S.seq || 0) + 1; return `${p}${S.seq.toString(36).toUpperCase().padStart(3, '0')}`; };
  E.hash = s => { let h = 5381; s = String(s); for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
  E.log = (S, o) => {
    const entry = Object.assign({ id: E.id(S, 'L'), at: E.now().toISOString(), level: 'info' }, o);
    S.log.unshift(entry); if (S.log.length > 1500) S.log.length = 1500; return entry;
  };
  // Returns true if the key is new (and claims it). Duplicate runs return false.
  E.once = (S, key) => { if (S.done[key]) return false; S.done[key] = E.now().toISOString(); return true; };
  E.find = (S, coll, id) => (S[coll] || []).find(x => x.id === id);
  E.person = (S, id) => S.people.find(p => p.id === id) || { name: 'Unassigned', id: null };
  E.venue = (S, id) => S.venues.find(v => v.id === id) || { short: '?', name: 'Unknown venue' };

  // ---------- knowledge (versioned, venue + effective-dated) ----------
  E.rule = (S, venue, key, onDate) => {
    onDate = onDate || E.lDate();
    const c = S.knowledge.filter(k => k.key === key && k.status === 'approved' && (k.venue === venue || k.venue === 'all') && k.effectiveFrom <= onDate);
    c.sort((a, b) => (a.venue === 'all') - (b.venue === 'all') || b.effectiveFrom.localeCompare(a.effectiveFrom) || b.version - a.version);
    return c[0] || null;
  };
  E.val = (S, venue, key, onDate) => { const r = E.rule(S, venue, key, onDate); return r ? r.value : undefined; };
  E.conflicts = S => {
    const out = [], seen = {};
    S.knowledge.filter(k => k.status === 'approved' && k.value !== undefined).forEach(k => {
      const g = `${k.key}|${k.venue}|${k.effectiveFrom}`; (seen[g] = seen[g] || []).push(k);
    });
    Object.values(seen).forEach(list => {
      const vals = [...new Set(list.map(k => JSON.stringify(k.value)))];
      if (vals.length > 1) out.push({ key: list[0].key, venue: list[0].venue, effectiveFrom: list[0].effectiveFrom, items: list });
    });
    return out;
  };

  // ---------- AI stand-in: enquiry classification ----------
  const MONTHS = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
  function parseDate(text, today) {
    let m = text.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s+(?:of\s+)?(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b(?:\s+(\d{4}))?/i);
    if (!m) { const m2 = text.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{1,2})(?:st|nd|rd|th)?\b(?:,?\s+(\d{4}))?/i); if (m2) m = [m2[0], m2[2], m2[1], m2[3]]; }
    if (!m) return null;
    const d = +m[1], mo = MONTHS[m[2].slice(0, 3).toLowerCase()]; let y = m[3] ? +m[3] : +today.slice(0, 4);
    let iso = `${y}-${String(mo + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    if (!m[3] && iso < today) iso = `${y + 1}${iso.slice(4)}`;
    return iso;
  }
  E.classify = (S, subject, body) => {
    const t = `${subject}\n${body}`, today = E.lDate();
    const c = { venue: null, type: 'general', date: null, time: null, groupSize: null, activities: [], childName: null, childAge: null, phone: null, missing: [], confidence: 0.6, model: 'demo-rules' };
    if (/hatfield|galleria/i.test(t)) c.venue = 'hat'; else if (/milton keynes|xscape|\bMK\b/i.test(t)) c.venue = 'mk';
    if (/corporate|team[- ]building|company|staff (social|away)/i.test(t)) c.type = 'corporate';
    else if (/\bschool|pupils|class trip|year \d/i.test(t)) c.type = 'school';
    else if (/\bSEND\b|additional needs|sensory|autis/i.test(t)) c.type = 'send';
    else if (/fostering|foster/i.test(t)) c.type = 'fostering';
    else if (/charity/i.test(t)) c.type = 'charity';
    else if (/hen do|hen party|adults? only|date night/i.test(t)) c.type = 'adult';
    else if (/birthday|party|turns \d|turning \d/i.test(t)) c.type = 'birthday';
    c.date = parseDate(t, today);
    const tm = t.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i); if (tm) { let h = +tm[1] % 12 + (/pm/i.test(tm[3]) ? 12 : 0); c.time = `${String(h).padStart(2, '0')}:${tm[2] || '00'}`; }
    else if (/\bmorning\b/i.test(t)) c.time = 'morning'; else if (/\bafternoon\b/i.test(t)) c.time = 'afternoon';
    const g = t.match(/\b(\d{1,3})\s*(?:children|kids|guests|people|pupils|friends|little ones|staff)\b/i); if (g) c.groupSize = +g[1];
    const acts = [[/uv|neon|glow/i, 'UV neon splatter'], [/slime/i, 'Slime'], [/drip ?bear/i, 'Drip bears'], [/canvas/i, 'Canvas painting'], [/t-?shirt/i, 'T-shirt painting'], [/smash/i, 'Smash room']];
    acts.forEach(([re, n]) => { if (re.test(t)) c.activities.push(n); });
    const cn = t.match(/\b(?:son|daughter|for)\s+([A-Z][a-z]+)(?:'s)?(?:\s+(?:who is|who's|turning|turns|is turning))?\s+(\d{1,2})(?:st|nd|rd|th)?\b/) || t.match(/\b([A-Z][a-z]+)\s+(?:is turning|turns|will be)\s+(\d{1,2})\b/) || t.match(/\b([A-Z][a-z]+)'s\s+(\d{1,2})(?:st|nd|rd|th)\b/);
    if (cn) { c.childName = cn[1]; c.childAge = +cn[2]; }
    const ph = t.match(/(?:\+44\s?7|\b07)\d{3}\s?\d{3}\s?\d{3}/); if (ph) c.phone = ph[0];
    const need = { venue: 'Venue', date: 'Date', groupSize: 'Group size' };
    if (c.type === 'birthday') Object.assign(need, { time: 'Preferred time', childAge: "Child's age", phone: 'Phone number' });
    if (['corporate', 'school', 'send', 'charity', 'fostering'].includes(c.type)) Object.assign(need, { time: 'Preferred time' });
    Object.keys(need).forEach(k => { if (!c[k]) c.missing.push(need[k]); });
    if (!c.activities.length) c.missing.push('Activities');
    c.confidence = Math.max(0.35, 0.95 - c.missing.length * 0.08);
    return c;
  };

  // ---------- matching ----------
  E.matchBookings = (S, email, date) => {
    let c = S.bookings.filter(b => b.status !== 'cancelled' && b.customer.email.toLowerCase() === (email || '').toLowerCase() && b.date >= E.lDate());
    if (date && c.length > 1) { const same = c.filter(b => b.date === date); if (same.length) c = same; }
    return c.map(b => b.id);
  };

  // ---------- availability ----------
  E.bookingsInRoom = (S, venue, date, room) => S.bookings.filter(b => b.status !== 'cancelled' && b.venue === venue && b.date === date && b.room === room && (b.kind === 'party' || b.private));
  E.overlaps = (a1, a2, b1, b2) => E.mins(a1) < E.mins(b2) && E.mins(b1) < E.mins(a2);
  E.availability = (S, venue, date, room) => {
    const slots = E.val(S, venue, 'party.slots', date) || [];
    const dur = E.val(S, venue, 'party.durationMins', date) || 120;
    const taken = E.bookingsInRoom(S, venue, date, room);
    return slots.filter(s => !taken.some(b => E.overlaps(s, E.addMins(s, dur), b.time, b.end)));
  };

  // ---------- drafting (AI stand-in using current venue rules) ----------
  E.draftReply = (S, th) => {
    const c = th.cls, v = c.venue || th.venue, venue = E.venue(S, v), first = (th.from.name || '').split(' ')[0] || 'there'; const flags = [];
    const src = []; const conf = E.conflicts(S); const use = (key, date) => { const cf = conf.find(x => x.key === key && (x.venue === v || x.venue === 'all')); if (cf) { flags.push(`Sources disagree on ${key} — decide in Approvals`); return undefined; } const r = E.rule(S, v, key, date); if (r && !src.includes(r.id)) src.push(r.id); return r ? r.value : undefined; };
    if (!v && !th.bookingId) { const last = (th.messages.filter(m => m.dir === 'in').slice(-1)[0] || {}).body || ''; const ans = E.topicAnswers(S, null, last, c.date, src, flags); const call = /\bring\b|call me|phone me|give me a call|call back/i.test(last);
      let b = 'Thank you for getting in touch with The Paint Patch!' + (ans.length ? '\n\n' + ans.join('\n\n') : '') + (call ? '\n\nOne of the team will give you a call shortly.' : '');
      const ask = ['which studio you\'d like — Xscape Milton Keynes or The Galleria Hatfield'].concat(c.date ? [] : ['your preferred date']).concat(c.groupSize ? [] : ['how many people']);
      b += `\n\nSo we can help, could you let us know ${E.andList(ask)}?`; flags.push('Venue not identified'); if (call) flags.push('Customer asked for a phone call — task created');
      return { text: `Hi ${first},\n\n${b}\n\nWarm wishes,\nThe Paint Patch team`, sources: src, flags }; }
    const d = c.date; let body = '';
    if (th.bookingId) {
      const b = E.find(S, 'bookings', th.bookingId), p = S.parties.find(x => x.bookingId === b.id), last = th.messages.filter(m => m.dir === 'in').slice(-1)[0].body;
      const ans = E.topicAnswers(S, b.venue, last, b.date, src, flags);
      body = `Thanks for your message about ${p && p.childName ? p.childName + "'s" : 'your'} party on ${E.fmtDateLong(b.date)} (booking ${b.ref}).` + (ans.length ? '\n\n' + ans.join('\n\n') : '\n\nWe\'ll come back to you shortly.');
      src.push('BOOKING:' + b.id);
      return { text: `Hi ${first},\n\n${body}\n\nWarm wishes,\nThe Paint Patch team — ${E.venue(S, b.venue).short}`, sources: src, flags };
    }
    const voice = E.rule(S, 'all', 'brand.voice'); if (voice) src.push(voice.id);
    const availKnown = !S.liveMode || E.connected(S, 'roller');
    const money = (val, label) => { if (val == null) { flags.push(`No approved price for ${label}`); return `[NEEDS ANSWER: ${label}]`; } return E.gbp(val); };
    if (c.type === 'birthday') {
      const min = use('party.minChildren', d), ppc = use('party.pricePerChild', d), dep = use('party.deposit', d), dur = use('party.durationMins', d);
      const room = use('party.room', d) || 'Party Room';
      const free = d ? E.availability(S, v, d, room) : [];
      if (d) src.push('AVAIL:' + v + ':' + d);
      const name = c.childName ? `${c.childName}'s` : 'the';
      if (c.groupSize && min && c.groupSize < min) {
        const gs = use('session.pricePerPerson', d), priv = use('private.uvPrice', d), privCap = use('private.uvCapacity', d), privRoom = 'UV Room';
        const privFree = d ? E.availability(S, v, d, privRoom) : [];
        if (d) src.push('AVAIL:' + v + ':' + d + ':uv');
        body = `What a lovely way to celebrate! Our hosted parties start from ${min} children, so for a group of ${c.groupSize} we have two options that work really well:\n\n• Join a general UV session — ${money(gs, 'general session price per child')} per child, you're in the room alongside other families and our team guides everyone through the activity.\n• Book the UV room privately — ${money(priv, 'private UV room price')} for up to ${privCap || '[NEEDS ANSWER: capacity]'} guests, so it's just your group.`;
        if (d && !availKnown) { body += `\n\n[NEEDS ANSWER: is the UV room free on ${E.fmtDateLong(d)}? Check ROLLER]`; flags.push('Availability not checked — ROLLER not connected'); }
        else if (d) body += privFree.length ? `\n\nOn ${E.fmtDateLong(d)} the UV room is currently free at ${privFree.join(', ')}. I can hold a slot for 24 hours while you decide.` : `\n\nThe UV room is already booked privately on ${E.fmtDateLong(d)}, so a private booking isn't possible that day — but general session spaces may still be available, or I can suggest another date.`;
        if (d && availKnown && privFree.length) th.promiseHint = { text: `Hold UV room on ${E.fmtDate(d)} for 24h`, hours: 24 };
        flags.push(`Below ${min}-child party minimum — alternatives offered`);
        if (d && availKnown && !privFree.length) flags.push('Private UV room unavailable — exclusivity not offered');
      } else {
        body = `Thank you so much for thinking of us for ${name} birthday${c.childAge ? ' — turning ' + c.childAge + ' is a big one' : ''}! Our hosted party is ${dur ? dur / 60 + ' hours' : '[NEEDS ANSWER: party length]'} with a dedicated host, ${c.activities.length ? c.activities.join(' and ') : 'paint splatter and the neon room'}, music, photos and a take-home creation for every guest.\n\nFor ${c.groupSize || 'your'} children it's ${money(ppc, 'party price per child')} per child${c.groupSize && ppc ? ` (${E.gbp(ppc * c.groupSize)} in total)` : ''}, with a ${money(dep, 'party deposit')} deposit to secure the date.`;
        if (d && !availKnown) { body += `\n\n[NEEDS ANSWER: party slots free on ${E.fmtDateLong(d)}? Check ROLLER]`; flags.push('Availability not checked — ROLLER not connected'); }
        else if (d) body += free.length ? `\n\nOn ${E.fmtDateLong(d)} we currently have ${free.length === 1 ? 'a slot' : 'slots'} at ${free.join(', ')} in our ${room}.` : `\n\nUnfortunately ${E.fmtDateLong(d)} is fully booked for parties — could another date work? I'd be happy to check.`;
        if (d && availKnown && !free.length) flags.push('No party slots free on requested date');
        if (c.groupSize && c.groupSize > (use('party.maxChildren', d) || 99)) flags.push('Above room capacity');
      }
      { const last = (th.messages.filter(m => m.dir === 'in').slice(-1)[0] || {}).body || ''; const ans = E.topicAnswers(S, v, last, d, src, flags); if (ans.length) body += '\n\n' + ans.join('\n\n'); }
      const ask = c.missing.filter(m => !['Venue', 'Date', 'Group size'].includes(m) || true).map(m => m.toLowerCase());
      if (ask.length) body += `\n\nTo get everything ready, could you let me know your ${ask.join(', ').replace(/, ([^,]*)$/, ' and $1')}?`;

  };

  const TOPICS = [[/dairy|vegan|gluten|allerg|dietary|halal/i, 'policy.dietary', 'dietary requirements'], [/own cake|bring (a |our own )?cake|\bcake\b/i, 'policy.ownCake', 'bringing your own cake'], [/arriv|early|set ?up/i, 'policy.arrival', 'arrival time'], [/carer|support worker|\bPA\b|personal assistant/i, 'policy.carer', 'carer / support worker tickets'], [/parking|park\b/i, 'policy.parking', 'parking'], [/wheelchair|accessib|step-free|lift\b/i, 'policy.access', 'accessibility'], [/age limit|how old|minimum age|toddler|under \d/i, 'policy.ages', 'age guidance'], [/gift (card|voucher)/i, 'policy.giftCards', 'gift cards'], [/refund|cancel/i, 'policy.cancellation', 'cancellations and refunds']];
  E.topicAnswers = (S, v, text, date, src, flags) => { const ans = []; TOPICS.forEach(([re, key, label]) => { if (!re.test(text)) return; const r = v ? E.rule(S, v, key, date) : E.rule(S, 'all', key, date); if (r && r.text && !/^PLACEHOLDER/.test(r.text)) { src.push(r.id); ans.push(r.text); } else { ans.push(`[NEEDS ANSWER: ${label} — no approved policy found]`); flags.push(`No approved policy for ${label}`); } }); return ans; };

  // ---------- Outlook (live) ----------
  E.htmlToText = h => String(h || '').replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|div|li|tr|h\d)>/gi, '\n').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&#39;|&rsquo;/g, "'").replace(/&quot;/g, '"').replace(/\r/g, '').replace(/\n{3,}/g, '\n\n').trim();
  E.stripQuoted = t => t.split(/\n(?:On .{5,120} wrote:|-{2,} ?Original Message|From: .+\nSent: )/)[0].trim();
  E.parseForm = t => { const g = re => { const m = t.match(re); return m ? m[1].trim() : ''; };
    return { topic: g(/Topic:\s*(.+?)\s+Name:/), name: g(/Name:\s*(.+?)\s+Email:/), email: g(/Email:\s*([^\s]+@[^\s]+)/), message: g(/Message:\s*([\s\S]+)$/), phone: (t.match(/(?:\+44\s?7|\b07)\d{3}\s?\d{3}\s?\d{3}/) || [''])[0] }; };
  E.skipSender = (email, subject) => { const e = (email || '').toLowerCase(); if (/no-?reply|notifications?@|mailer-daemon|postmaster|newsletter|marketing@|updates@|bounce/.test(e)) return 'automated sender';
    if (/@thepaintpatch\.com$/.test(e) && !/^website contact/i.test(subject || '')) return 'internal'; return null; };
  E.importOutlook = (S, m) => { // m: {id, conversationId, subject, fromName, fromEmail, bodyText, receivedAt, webLink}
    if (S.done['ol:' + m.id]) return null;
    const why = E.skipSender(m.fromEmail, m.subject); if (why) { S.done['ol:' + m.id] = 'skipped:' + why; return null; }
    let from = { name: m.fromName || m.fromEmail, email: m.fromEmail }, body = E.stripQuoted(m.bodyText), replyTo = null;
    if (/^job application/i.test(m.subject || '')) { S.done['ol:' + m.id] = E.now().toISOString(); E.migrateHR(S);
      const g = re => { const x = body.match(re); return x ? x[1].trim() : ''; }; const role = g(/Role:\s*(.+?)\s+Applicant name:/i) || m.subject.replace(/^job application,?\s*/i, '');
      const vac = S.hr.vacancies.find(v => v.status === 'open' && role.toLowerCase().includes(v.title.toLowerCase().split(' ')[0]));
      E.addCandidate(S, { name: g(/Applicant name:\s*(.+?)\s+Applicant email:/i) || 'Applicant', email: g(/Applicant email:\s*(\S+@\S+)/i), role, vacancyId: vac ? vac.id : null, about: g(/About them:\s*([\s\S]+)$/i).slice(0, 600), source: 'website job form', outlook: { messageId: m.id, webLink: m.webLink } });
      return null; }
    if (/^website contact/i.test(m.subject || '')) { const f = E.parseForm(body); if (f.email) { from = { name: f.name || f.email, email: f.email }; replyTo = f.email; body = `${f.message}${f.phone && !f.message.includes(f.phone) ? '\nPhone: ' + f.phone : ''}\n\n(via website contact form — ${f.topic || 'enquiry'})`; } }
    S.done['ol:' + m.id] = E.now().toISOString();
    const existing = S.threads.find(t => t.outlook && t.outlook.conversationId === m.conversationId && !replyTo);
    const th = E.receiveEmail(S, { from, subject: m.subject || '(no subject)', body, threadId: existing && existing.id });
    th.live = true; th.outlook = Object.assign(th.outlook || {}, { conversationId: m.conversationId, messageId: m.id, webLink: m.webLink, replyTo });
    const msg = th.messages[th.messages.length - 1]; msg.at = m.receivedAt; msg.outlookId = m.id; th.updatedAt = m.receivedAt;
    if (/\bring\b|call me|phone me|give me a call|call back/i.test(body)) { const ph = (body.match(/(?:\+44\s?7|\b07)\d{3}\s?\d{3}\s?\d{3}/) || [''])[0];
      E.addTask(S, { title: `Call ${from.name}${ph ? ' on ' + ph : ''} — asked for a phone call`, owner: th.venue ? E.leadOf(S, th.venue) : (S.people.find(p => p.role === 'ops') || {}).id, venue: th.venue, due: E.lDate(), ref: { type: 'thread', id: th.id }, kind: 'follow-up' }, 'call:' + m.id); }

  };

  // ---------- approvals ----------
  E.addApproval = (S, a, key) => {
    if (key && !E.once(S, 'approval:' + key)) { E.log(S, { actor: 'System', auto: true, action: 'Duplicate prevented', detail: `Approval "${a.title}" already exists`, level: 'info', ref: a.ref }); return null; }

  E.automation = (S, id) => S.automations.find(a => a.id === id);
  // Run an automation step with pause/integration checks and a recorded result.
  E.run = (S, autoId, ref, fn) => {
    const a = E.automation(S, autoId); if (!a) return fn();

    const down = (a.uses || []).map(i => S.integrations.find(x => x.id === i)).filter(i => i && (i.status === 'disconnected' || i.status === 'attention'));
    if (down.length) { const msg = `${down.map(i => i.name).join(', ')} ${down.length > 1 ? 'are' : 'is'} ${down[0].status === 'disconnected' ? 'disconnected' : 'needing attention'}`; Object.assign(a, { lastRun: runRec.at, lastStatus: 'failed', lastResult: msg, lastRef: ref }); E.log(S, { actor: a.name, auto: true, action: 'Failed', detail: msg, ref, level: 'fail' }); return { failed: msg }; }
    try { const r = fn(a) || {}; Object.assign(a, { lastRun: runRec.at, lastStatus: r.status || 'ok', lastResult: r.result || 'Completed', lastRef: ref }); return r; }
    catch (e) { Object.assign(a, { lastRun: runRec.at, lastStatus: 'failed', lastResult: String(e.message || e), lastRef: ref }); E.log(S, { actor: a.name, auto: true, action: 'Failed', detail: String(e.message || e), ref, level: 'fail' }); return { failed: e.message }; }
  };
  E.modeOf = (S, autoId) => { const a = E.automation(S, autoId); if (!a) return 'approve'; if (a.mode === 'auto' && a.templateKey) { const t = E.rule(S, 'all', a.templateKey); if (!t || t.reviewNeeded) return 'approve'; } return a.mode; };

  // ---------- inbound email ----------
  E.receiveEmail = (S, mail) => { // mail: {from:{name,email}, subject, body, threadId?}

    if (th) { th.messages.push(msg); th.updatedAt = msg.at; E.log(S, { actor: 'Outlook', auto: true, action: 'Reply received', ref: { type: 'thread', id: th.id }, venue: th.venue, detail: `${th.from.name}: "${mail.body.slice(0, 60)}…"` }); stopFollowUps(S, th, 'Customer replied'); if (th.partyId) E.processPartyReply(S, th, msg); return th; }
    th = { id: E.id(S, 'T'), from: mail.from, subject: mail.subject, messages: [msg], state: 'new', createdAt: msg.at, updatedAt: msg.at, candidates: [], bookingId: null, partyId: null, promises: [] };
    S.threads.unshift(th);
    E.log(S, { actor: 'Outlook', auto: true, action: 'Enquiry received', ref: { type: 'thread', id: th.id }, detail: `${mail.from.name} — ${mail.subject}` });

      th.candidates = E.matchBookings(S, mail.from.email, th.cls && th.cls.date);
      if (th.candidates.length === 1) { E.linkThread(S, th, th.candidates[0], 'Booking matcher'); return { result: 'Linked to 1 booking' }; }

  };
  E.chooseMatch = (S, thId, bookingId, who) => { const th = E.find(S, 'threads', thId); E.linkThread(S, th, bookingId, null); E.log(S, { actor: who || 'You', action: 'Chose booking', ref: { type: 'thread', id: th.id }, venue: th.venue, detail: (E.find(S, 'bookings', bookingId) || {}).ref }); if (th.cls) E.prepareDraft(S, th); return th; };
  E.prepareDraft = (S, th) => E.run(S, 'draft', { type: 'thread', id: th.id }, () => {

  };

  E.sendEmail = (S, th, text, actor, key, delivered) => {

    if (!E.once(S, 'email:' + key)) { E.log(S, { actor: 'Outlook', auto: true, action: 'Duplicate email prevented', ref: { type: 'thread', id: th.id }, detail: 'This message was already sent' }); return false; }

  };

  // ---------- tasks & promises ----------
  E.leadOf = (S, venue) => (S.people.find(p => p.role === 'lead' && p.venue === venue) || S.people.find(p => p.role === 'ops') || {}).id;
  E.addTask = (S, t, key) => {
    if (key && !E.once(S, 'task:' + key)) return S.tasks.find(x => x.key === key) || null;
    const task = Object.assign({ id: E.id(S, 'K'), status: 'open', createdAt: E.now().toISOString(), key }, t); S.tasks.unshift(task);

    return task;
  };
  E.addPromise = (S, p, key) => { const t = E.addTask(S, Object.assign({}, p, { kind: 'promise', title: p.text, due: E.lDate(new Date(p.due)), dueAt: p.due }), key); return t; };
  E.completeTask = (S, id, who) => { const t = E.find(S, 'tasks', id); if (!t || t.status !== 'open') return; t.status = 'done'; t.doneAt = E.now().toISOString(); E.log(S, { actor: who || 'You', action: 'Task completed', ref: { type: 'task', id }, venue: t.venue, detail: t.title, level: 'ok' }); };

  // ---------- parties ----------
  E.buildParty = (S, b, thread) => {
    if (!E.once(S, 'party:' + b.id)) { E.log(S, { actor: 'Party builder', auto: true, action: 'Duplicate prevented', ref: { type: 'booking', id: b.id }, detail: 'Party record already exists for this booking' }); return S.parties.find(p => p.bookingId === b.id); }

  E.rebase = (obj, days) => {
    const re = /^(\d{4}-\d{2}-\d{2})(.*)$/;
    const walk = o => { if (Array.isArray(o)) return o.map(walk); if (o && typeof o === 'object') { const r = {}; for (const k in o) r[k] = walk(o[k]); return r; }
      if (typeof o === 'string') { const m = o.match(re); if (m) { if (m[2].startsWith('T')) return new Date(new Date(o).getTime() + days * 864e5).toISOString(); if (m[2] === '') return E.addDays(m[1], days); } } return o; };

  }
  function sheetApproval(ap, mode) {
    const th = ap.kind === 'reply' && E.find(S, 'threads', ap.ref.id);
    let body = apCard(ap);
    if (mode === 'edit') {
      if (th) body += `<h3>Edit reply</h3><textarea id="apText" rows="14">${h(th.draft.text)}</textarea><div class="srcs"><b>Sources</b>${th.draft.sources.map(srcChip).join('')}</div><button class="b ok block" data-ap="approve-edit:${ap.id}">Approve & send edited reply</button>`;
      else if (ap.kind === 'refund') body += `<h3>Refund amount</h3><div class="row"><input id="apAmt" type="number" step="0.01" value="${ap.payload.amount}"><button class="b ok" data-ap="approve-amt:${ap.id}">Approve refund</button></div>`;
      else if (ap.kind === 'spend') body += `<h3>Quantity</h3><div class="row"><input id="apQty" type="number" value="${ap.payload.qty}"><button class="b ok" data-ap="approve-qty:${ap.id}">Approve order</button></div>`;
      else if (ap.kind === 'conflict') body += `<h3>Which source is correct?</h3>${ap.payload.items.map(id => { const k = E.find(S, 'knowledge', id); return `<button class="b block" data-ap="keep:${ap.id}:${id}">Keep ${h(k.title)} v${k.version} — ${typeof k.value === 'number' ? E.gbp(k.value) : h(JSON.stringify(k.value))}</button>`; }).join('')}`;
      else body += `<h3>Note</h3><div class="row"><input id="apNote" placeholder="What you agreed"><button class="b ok" data-ap="approve-note:${ap.id}">Approve with note</button></div>`;
    }
    if (mode === 'delegate') body += `<h3>Delegate to</h3>${S.people.filter(p => p.role !== 'staff' && p.id !== me()).map(p => `<button class="b block" data-ap="delegate:${ap.id}:${p.id}">${h(p.name)} — ${h(p.title)}</button>`).join('')}`;
    if (mode === 'decline') body += `<h3>Reason</h3><div class="row"><input id="apReason" placeholder="Why (kept on the record)"><button class="b bad" data-ap="decline:${ap.id}">Decline</button></div>`;
    if (th) body += `<h3>Draft</h3><pre class="inv">${h(th.draft.text)}</pre><button class="link" data-open="thread:${th.id}">Open conversation →</button>`;

    return `<h1>${h(ap.title)}</h1>${body}${historyFor('approval', ap.id)}`;

    const rem = p ? S.reminders.filter(r => r.partyId === p.id) : [];
    const steps = [
      ['A Hatfield birthday enquiry arrives', !!th, 'enquiry', th && refLink({ type: 'thread', id: th.id }, 'open enquiry')],
      ['HQ drafts the right response → approve it', apR && apR.status === 'approved', 'approve', apR && refLink({ type: 'approval', id: apR.id }, 'open approval')],
      ['Parent books in ROLLER → party record + host sheet', !!p, 'confirm', p && refLink({ type: 'party', id: p.id }, 'open host sheet')],
      ['Missing pizza choices trigger one reminder (runs the job as if 25h later)', rem.some(r => r.status === 'sent'), 'remind', p && `${rem.filter(r => r.status === 'sent').length} sent`],
      ["Parent's reply updates host sheet and cancels further reminders", p && E.foodMissing(p) === 0, 'reply', p && `${p.food.choices.length}/${p.guests} choices · ${rem.filter(r => r.status === 'cancelled').length} cancelled`],
      ['Venue lead sees the party as Ready', p && E.partyStatus(S, p).ready, 'lead', p && (E.partyStatus(S, p).ready ? 'Ready' : E.partyStatus(S, p).reasons[0]), true],
      ['Morning briefing reflects the change', p && E.briefing(S, 'hat').some(l => /Oscar/.test(l.text)), 'brief', p && E.briefing(S, 'hat').some(l => /Oscar/.test(l.text)) ? 'Line added' : '', true],
    ];
    const firstUndone = steps.findIndex(s => !s[1]);
    return card('Acceptance journey (live records)', `<ol class="steps">${steps.map((s, i) => `<li class="${s[1] ? 'done' : i === firstUndone ? 'next' : ''}"><div><b>${h(s[0])}</b><div class="small muted">${s[3] || ''}</div></div>${s[4] && (i === 0 || steps[i - 1][1]) ? `<button class="b sm" data-demo="${s[2]}">View</button>` : s[1] ? '✓' : i === firstUndone ? `<button class="b ok sm" data-demo="${s[2]}">Run</button>` : ''}</li>`).join('')}</ol>`, { icon: '▶' }) +
      card('Edge-case tests', `<div class="tgrid">
        <button class="b" data-demo="move" ${p && p.status === 'active' ? '' : 'disabled'}>Reschedule Oscar's party (+1 day)</button>
        <button class="b" data-demo="cancel" ${p && p.status === 'active' ? '' : 'disabled'}>Cancel Oscar's party</button>
        <button class="b" data-demo="ambig">Open ambiguous booking match</button>
        <button class="b" data-demo="dupe">Duplicate CSV import</button>
        <button class="b" data-demo="disc">Disconnect Outlook, then try to send</button>
        <button class="b" data-demo="twice">Run every daily job twice</button></div>
        <div class="sub">Then refresh the page: edits, approvals and history should all still be here.</div>`, { icon: '⚙' }) +
      card('Automated acceptance test (sandbox copy)', `<p class="muted small">Runs the whole journey plus edge cases on a throwaway copy of the demo data. Your live records are untouched.</p><button class="b ok block" data-demo="sandbox">Run ${UI.fixture ? '' : '(needs demo fixture)'}</button>${UI.testResults ? `<div class="sub"><b>${UI.testResults.filter(r => r[0] === 'PASS').length}/${UI.testResults.length} passed</b></div><ul class="tres">${UI.testResults.map(r => `<li class="${r[0]}"><b>${r[0]}</b> ${h(r[1])}${r[2] ? `<div class="small muted">${h(String(r[2]).slice(0, 160))}</div>` : ''}</li>`).join('')}</ul>` : ''}`, { icon: '✓' });
  }

  function screenNoAccess() {

    return `<div class="loading" style="padding-top:18vh"><span class="badge big"></span><h2 style="margin:6px 0">Paint Patch HQ</h2>${!ID.uid ? `<p>Please sign in to claude.ai to use HQ.</p>` : req ? `<p><b>Request sent.</b></p><p class="muted small">Aliyah will give you a role. This page updates by itself once she does.</p>` : `<p>Hi${ID.name ? ' ' + h(ID.name.split(' ')[0]) : ''} — you're signed in, but you haven't been added to HQ yet.</p><textarea id="reqNote" rows="2" placeholder="Who are you? e.g. Sam, Hatfield venue lead" style="max-width:360px"></textarea><br><button class="b ok" data-request-access>Request access</button>${UI.reqError ? `<p class="small" style="color:var(--bad)">${h(UI.reqError)}</p>` : ''}`}</div>`;

  async function requestAccess() {
    const note = ($('#reqNote') || {}).value || '';
    try { await Store.db.doc('requests/' + ID.uid).set({ uid: ID.uid, note: note.slice(0, 200), at: Date.now() }); UI.myRequest = true; UI.reqError = null; }
    catch (e) { UI.reqError = e && e.code === 'invalid_argument' ? 'Your access level can\'t send requests. Ask Aliyah to share HQ with you as a Contributor or Editor.' : 'Couldn\'t send — try again.'; }
    render();
  }
  function watchRequests() {
    if (!Store.db || !(R().key === 'owner' || can('managePeople'))) return;
    try { Store.db.collection('requests').onSnapshot(qs => { UI.requests = qs.docs.map(d => d.data()).filter(r => r && r.uid && !S.people.some(p => p.uid === r.uid)); render(); }, () => { }); } catch (e) { }
  }
  // Fill in claude.ai names/emails for people and requests after render (never stored).

    if (!ID.userNs) return; const els = [...document.querySelectorAll('[data-uidname]')]; if (!els.length) return;
    try { const ps = await ID.userNs.profiles([...new Set(els.map(e => e.dataset.uidname))]); els.forEach(e => { const p = ps[e.dataset.uidname]; if (p) e.textContent = [p.name, p.email].filter(Boolean).join(' · ') || 'claude.ai account'; }); } catch (e) { }
  }

    (S.tasks || []).forEach(t => add('task', t.id, t.title, `Task · ${t.status}${t.owner ? ' · ' + who(t.owner) : ''}${t.due ? ' · due ' + t.due : ''}${t.status === 'open' && t.due && t.due < E.lDate() ? ' · OVERDUE' : ''}`, t.kind || '', t.venue));
    (S.parties || []).forEach(p => add('party', p.id, `${p.childName || 'Party'}${p.childAge ? ' (' + p.childAge + ')' : ''}`, `Party · ${p.date} ${p.start || ''} · ${p.guests || '?'} children · ${E.partyStatus(S, p).ready ? 'Ready' : 'Not ready'}`, `${p.room || ''} ${(E.partyStatus(S, p).reasons || []).join(' ')}`, p.venue));
    (S.bookings || []).forEach(b => add('booking', b.id, `${(b.customer || {}).name || 'Booking'} · ${b.product || ''}`, `Booking · ${b.date} ${b.time || ''} · ${b.guests || '?'} guests · ${b.status || ''}`, `${b.ref || ''} ${b.room || ''}${r.contact ? ' ' + ((b.customer || {}).email || '') + ' ' + ((b.customer || {}).phone || '') : ''}`, b.venue));
    if (can('inbox')) (S.threads || []).forEach(t => add('thread', t.id, `${t.from.name}: ${t.subject}`, `Email · ${t.state} · ${t.updatedAt ? String(t.updatedAt).slice(0, 10) : ''}`, ((t.cls ? t.cls.type + ' ' : '') + (t.messages || []).map(m => (m.dir === 'out' ? 'Us: ' : 'Them: ') + m.body).join(' \n ')).slice(0, 1800) + (r.contact ? ' ' + (t.from.email || '') : ''), t.venue));
    (S.knowledge || []).filter(k => k.status !== 'superseded').forEach(k => { const v = k.value === undefined ? '' : Array.isArray(k.value) ? k.value.map(x => x.name || x).join(', ') : typeof k.value === 'number' && /price|deposit|addon/.test(k.key || '') ? E.gbp(k.value) : k.value; add('knowledge', k.id, k.title, `Knowledge${k.kind ? ' · ' + k.kind : ''} · ${k.venue === 'all' ? 'all sites' : E.venue(S, k.venue).short}${k.effectiveFrom ? ' · from ' + k.effectiveFrom : ''}`, `${v} ${k.text || ''}`.slice(0, 1200), k.venue === 'all' ? null : k.venue); });
    const sens = r.key === 'owner' || r.approve.includes('complaint');
    (S.cases || []).filter(c => !c.sensitive || sens).forEach(c => add('case', c.id, `${c.customer} — ${c.kind}`, `Case · ${c.status}${c.owner ? ' · ' + who(c.owner) : ''}`, c.summary || '', c.venue));
    (S.checklists || []).forEach(c => { const st = E.clStatus(S, c); add('checklist', c.id, c.title, `Checklist · ${c.date || ''} · ${st.done}/${st.total}${st.overdue ? ' · OVERDUE' : ''}`, '', c.venue); });
    (S.stock || []).forEach(s => add('stock', s.id, s.item, `Stock · ${s.level} ${s.unit || ''} (min ${s.min})`, '', s.venue));
    if (can('hr') && S.hr && Array.isArray(S.hr.candidates)) S.hr.candidates.forEach(c => add('candidate', c.id, c.name, `Candidate · ${c.stage} · ${c.role || ''}`, (c.about || '').slice(0, 400)));
    if (can('inbox')) (S.log || []).slice(0, 250).forEach(l => add('log', l.id, l.action, `Activity · ${l.actor} · ${String(l.at || '').slice(0, 16).replace('T', ' ')}`, l.detail || '', l.venue));
    return out;
  }
  function askSearch(q, idx, n) {
    const words = q.toLowerCase().replace(/[^a-z0-9£@.\s-]/g, ' ').split(/\s+/).filter(w => w.length > 1 && !STOP.has(w)).map(w => w.length > 4 && /[^s]s$/.test(w) ? w.slice(0, -1) : w);
    if (!words.length) return [];
    return idx.map(x => { let s = 0; words.forEach(w => { if (x.title.toLowerCase().includes(w)) s += 3; else if (x.sub.toLowerCase().includes(w)) s += 2; else if (x.hay.includes(w)) s += 1; }); if (/overdue|late/.test(q.toLowerCase()) && /OVERDUE/.test(x.sub)) s += 3; return [s, x]; })
      .filter(a => a[0] > 0).sort((a, b) => b[0] - a[0]).slice(0, n || 8).map(a => a[1]);
  }
  function askSummary() {
    const today = E.lDate(), r = R();
    const tasks = S.tasks.filter(t => t.status === 'open' && inSite(t.venue));
    const parties = S.parties.filter(p => inSite(p.venue) && p.date >= today && p.date <= E.addDays(today, 7) && !E.partyStatus(S, p).cancelled);
    const lines = [`Today: ${E.fmtDateLong(today)} ${E.lTime()} (Europe/London). Viewer role: ${r.label}.`,
      `Venues: ${S.venues.filter(v => inSite(v.id)).map(v => v.name + ' (' + v.status + ')').join('; ')}.`,
      `Open tasks: ${tasks.length}, overdue: ${tasks.filter(t => t.due && t.due < today).length}. Approvals waiting for this viewer: ${myAps().length}.`,
      `Parties in the next 7 days: ${parties.length}${parties.length ? ' — ' + parties.map(p => `${p.childName || 'Party'} ${p.date} [party:${p.id}]`).join(', ') : ''}.`];
    if (can('inbox')) lines.push(`Inbox needing action: ${S.threads.filter(t => inSite(t.venue) && ['new', 'awaiting-approval', 'needs-choice'].includes(t.state)).length}.`);
    lines.push(`Integrations: ${S.integrations.map(i => i.name + ' ' + i.status).join(', ')}.`);
    return lines.join('\n');
  }
  const ASK_RULES = `You are "Ask HQ", the assistant inside The Paint Patch HQ dashboard (a UV / neon paint studio with venues at Xscape Milton Keynes and The Galleria Hatfield).
Rules:
- Answer ONLY from the SUMMARY and RECORDS supplied. If the answer is not there, say plainly that HQ doesn't hold it, and name the likely missing source (e.g. ROLLER or Xero not connected). Never invent prices, dates, figures, names or policies.
- Cite every record you rely on by writing its reference exactly as given in square brackets, e.g. [task:T12] or [party:P3]. Only use references that appear in the data.
- UK English, £, 24-hour times. Be brief: at most about 120 words, short sentences or a few "- " bullets. No headings.
- You cannot take actions. If asked to do something, say where in HQ to do it (Inbox, Approvals, Parties, Operations, HR, Knowledge).
- The data reflects only what this viewer is permitted to see; don't speculate about anything else.`;
  function askRender() {
    let el = document.getElementById('askhq'); if (!el) { el = document.createElement('div'); el.id = 'askhq'; document.body.appendChild(el); }
    const ok = S && !R().none;
    const fab = ok && !ASK.open && UI.screen !== 'today' && !UI.sheet;
    const ai = ASK.sample && !ASK.off;
    const sugg = ['What\'s overdue?', 'Parties this week', ...(can('inbox') ? ['Unanswered enquiries'] : []), 'Party prices', 'Own cake policy'];
    el.innerHTML = (fab ? `<button class="askfab" data-ask-open>✦ Ask HQ</button>` : '') + (ok && ASK.open ? `<div class="askpanel" role="dialog" aria-label="Ask HQ">
      <div class="askh"><b>✦ Ask HQ</b><span class="muted small">${ai ? 'Search + Claude' : 'Search only' + (ASK.off ? ' — ' + h(ASK.off) : '')}</span>${ASK.turns.length ? '<button class="chip" data-ask-new>New</button>' : ''}<button class="x2" data-ask-close aria-label="Close">✕</button></div>
      <div class="askmsgs" id="askmsgs">${ASK.turns.length ? ASK.turns.map(askTurnHTML).join('') : `<div class="askempty"><p>Search everything you can see in HQ — tasks, parties, bookings${can('inbox') ? ', emails' : ''}, prices &amp; policies${can('hr') ? ', candidates' : ''}${ai ? ' — and ask questions in plain English' : ''}.</p><div class="asksugg">${sugg.map(s => `<button class="chip" data-ask-q="${h(s)}">${h(s)}</button>`).join('')}</div></div>`}</div>
      <form class="askin" id="askform"><input id="askq" autocomplete="off" placeholder="${ai ? 'Ask a question or search…' : 'Search HQ…'}" value="${h(ASK.draft)}">${ASK.busy ? '<button type="button" class="b" data-ask-stop>Stop</button>' : '<button class="b ok">Send</button>'}</form></div>` : '');
    const m = document.getElementById('askmsgs'); if (m) m.scrollTop = m.scrollHeight;
  }
  const askLink = (ref, label) => `<button class="askref" data-open="${h(ref)}" data-ask-hop>${h(label)}</button>`;
  function askFormat(text, refs) {
    let s = h(text).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    s = s.replace(/\[([a-z]+):([A-Za-z0-9_-]+)\]/g, (all, t, id) => { const x = refs[t + ':' + id]; return x ? askLink(x.ref, x.title.length > 34 ? x.title.slice(0, 32) + '…' : x.title) : ''; });
    return s.split(/\n+/).map(l => /^\s*[-•]\s+/.test(l) ? `<li>${l.replace(/^\s*[-•]\s+/, '')}</li>` : `<p>${l}</p>`).join('').replace(/(<li>.*?<\/li>)+/g, m => `<ul>${m}</ul>`);
  }
  function askTurnHTML(t) {
    if (t.role === 'user') return `<div class="askq"><span>${h(t.q)}</span></div>`;
    const hits = t.hits || [];
    return `<div class="aska">${hits.length ? `<div class="askhits"><div class="muted small">${hits.length} matching record${hits.length > 1 ? 's' : ''}</div>${hits.slice(0, 5).map(x => `<button class="askhit" data-open="${h(x.ref)}" data-ask-hop><b>${h(x.title)}</b><span>${h(x.sub)}</span></button>`).join('')}</div>` : `<div class="muted small">No matching records.</div>`}
      ${t.ai !== undefined ? `<div class="askai" id="${t.aid}">${t.ai ? askFormat(t.ai, t.refs || {}) : '<span class="thinking">Thinking…</span>'}${t.note ? `<div class="muted small">${h(t.note)}</div>` : ''}</div>` : ''}</div>`;
  }
  async function askSend(q) {
    q = String(q || '').trim(); if (!q || ASK.busy) return;
    ASK.draft = '';
    const idx = askIndex(), refs = Object.fromEntries(idx.map(x => [x.ref, x]));
    let hits = askSearch(q, idx, 25);
    // follow-ups like "and Hatfield?" still carry the previous context
    const prevQ = ASK.turns.filter(t => t.role === 'user').slice(-1)[0];
    const ctx = hits.length < 6 && prevQ ? askSearch(prevQ.q + ' ' + q, idx, 25) : hits;
    const ai = ASK.sample && !ASK.off;
    const turn = { role: 'assistant', hits, refs, aid: 'ai' + Date.now() };
    if (ai) turn.ai = '';
    ASK.turns.push({ role: 'user', q }, turn); askRender();
    if (!ai) return;
    const ctl = new AbortController(); ASK.busy = ctl; askRender();
    const data = `SUMMARY:\n${askSummary()}\n\nRECORDS (most relevant first):\n${ctx.map(x => `[${x.ref}] ${x.title} — ${x.sub}${x.body ? ' — ' + x.body.replace(/\s+/g, ' ').slice(0, 600) : ''}`).join('\n') || '(none matched)'}\n\nQUESTION: ${q}`;
    const hist = [];
    ASK.turns.slice(0, -2).slice(-8).forEach(t => { if (t.role === 'user') hist.push({ role: 'user', content: t.q }); else if (t.ai) hist.push({ role: 'assistant', content: t.ai }); });
    const msgs = [{ role: 'user', content: ASK_RULES }, ...hist, { role: 'user', content: data }];
    const paint = () => { const el = document.getElementById(turn.aid); if (el) { el.innerHTML = askFormat(turn.ai, refs) + (turn.note ? `<div class="muted small">${h(turn.note)}</div>` : ''); const m = document.getElementById('askmsgs'); if (m) m.scrollTop = m.scrollHeight; } };
    try {
      const r = await ASK.sample(msgs, { cache: false, signal: ctl.signal, onText: ({ text }) => { turn.ai = text; paint(); } });
      turn.ai = r.text; if (r.truncated) turn.note = 'Answer cut short — try a narrower question.';
    } catch (e) {
      turn.ai = (e && e.text) || '';
      const c = e && e.code;
      if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(c)) { ASK.off = 'Claude answers are off'; if (!turn.ai) delete turn.ai; }
      else if (c === 'cancelled') turn.note = turn.ai ? 'Stopped.' : '';
      else if (c === 'rate_limited') turn.note = 'Too many questions just now — try again in a minute.';
      else if (c === 'session_expired') turn.note = 'Please sign in to Claude again.';
      else if (c === 'refused') { turn.ai = ''; turn.note = 'Claude couldn\'t answer that — try rewording.'; }
      else turn.note = 'Answer interrupted — try again.';
      if (turn.ai === '' && !turn.note) delete turn.ai;
    }
    ASK.busy = null; askRender();
  }
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-ask-open],[data-ask-close],[data-ask-new],[data-ask-stop],[data-ask-q],[data-ask-hop]'); if (!el) return;
    const d = el.dataset;
    if (d.askOpen !== undefined) { ASK.open = true; if (d.askOpen) ASK.draft = d.askOpen; askRender(); const i = document.getElementById('askq'); if (i) i.focus(); return; }
    if (d.askClose !== undefined) { ASK.open = false; askRender(); return; }
    if (d.askNew !== undefined) { if (ASK.busy) ASK.busy.abort(); ASK.turns = []; askRender(); return; }
    if (d.askStop !== undefined) { if (ASK.busy) ASK.busy.abort(); return; }
    if (d.askQ) return askSend(d.askQ);
    if (d.askHop !== undefined) { ASK.open = false; setTimeout(askRender, 0); }
  });
  document.addEventListener('submit', e => { if (e.target.id === 'askform') { e.preventDefault(); askSend($('#askq').value); } if (e.target.id === 'askbar') { e.preventDefault(); const v = $('#askbarq').value.trim(); ASK.open = true; askRender(); if (v) askSend(v); } });
  document.addEventListener('input', e => { if (e.target.id === 'askq') ASK.draft = e.target.value; });
  (async () => { try { ASK.sample = window.claude && window.claude.use ? await window.claude.use('sample') : null; } catch (e) { ASK.sample = null; } askRender(); if (UI.screen === 'today' && S) render(); })();
  const askBar = () => `<form class="askbar" id="askbar"><span>✦</span><input id="askbarq" autocomplete="off" placeholder="${ASK.sample ? 'Ask HQ anything or search…' : 'Search HQ…'}"><button class="b sm ok">Ask</button></form>`;
  window.HQ_UI = { get S() { return S; }, UI, Store, render };
  boot();
})();
</script>
